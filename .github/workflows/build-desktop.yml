name: Build Desktop App

on:
  # Tag push triggers the build (e.g., v1.2.0); deployment remains manual.
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  # Manual trigger retained as fallback
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.7). Must match Cargo.toml"
        required: false
        type: string
      release_notes_override:
        description: "Custom release notes (overrides auto-generation if provided)"
        required: false
        type: string

jobs:
  # ── Validate version before building ──
  validate:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for tag comparison

      - name: Read and validate versions
        id: version
        run: |
          ROOT_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          APP_VERSION="$ROOT_VERSION"
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

          # Determine the target version
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION=$(echo "${{ github.ref }}" | sed 's|refs/tags/v||')
          elif [ -n "${{ inputs.version }}" ]; then
            TAG_VERSION="${{ inputs.version }}"
          else
            TAG_VERSION="$APP_VERSION"
          fi
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

          # Validation 1: tag version matches the single Cargo workspace version
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error:: Cargo.toml version ($APP_VERSION) does not match tag/input version ($TAG_VERSION)"
            exit 1
          fi

          # Validation 2: version is newer than latest existing release tag
          LATEST_TAG=$(git tag --sort=-version:refname 'v*' 2>/dev/null | grep -v "v$APP_VERSION" | head -1 | sed 's/^v//')
          if [ -n "$LATEST_TAG" ]; then
            HIGHER=$(printf "%s\n%s" "$APP_VERSION" "$LATEST_TAG" | sort -V | tail -1)
            if [ "$HIGHER" != "$APP_VERSION" ]; then
              echo "::error:: version $APP_VERSION is not newer than latest release $LATEST_TAG"
              exit 1
            fi
            echo "previous_tag=v$LATEST_TAG" >> $GITHUB_OUTPUT
          else
            echo "previous_tag=" >> $GITHUB_OUTPUT
          fi

          echo "✅ Validated: releasing v$APP_VERSION"

  # ── Build all platforms in parallel ──
  build:
    needs: validate
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-apple-silicon
            platform: darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
            platform: darwin-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install npm deps
        working-directory: desktop
        run: npm ci

      - name: Build kn-agent
        run: |
          cargo build --release --target ${{ matrix.target }} --bin kn-agent
          mkdir -p desktop/src-tauri/resources
          cp target/${{ matrix.target }}/release/kn-agent desktop/src-tauri/resources/kn-agent
          chmod +x desktop/src-tauri/resources/kn-agent
          file desktop/src-tauri/resources/kn-agent
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) file desktop/src-tauri/resources/kn-agent | grep -q "arm64" ;;
            x86_64-apple-darwin) file desktop/src-tauri/resources/kn-agent | grep -q "x86_64" ;;
          esac
          echo "✅ kn-agent copied to desktop/src-tauri/resources/"

      - name: Validate signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_TEAM_ID APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$(mktemp -d)/certificate.p12
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"; then
            echo "::error::APPLE_CERTIFICATE must be a base64-encoded .p12 certificate export"
            exit 1
          fi
          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Decoded APPLE_CERTIFICATE is empty"
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No Developer ID Application signing identity found in APPLE_CERTIFICATE. Export a .p12 that includes the certificate and private key."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          SIGNING_PROBE=$(mktemp -d)/codesign-probe
          cp /usr/bin/true "$SIGNING_PROBE"
          codesign --force --sign "$SIGNING_IDENTITY" "$SIGNING_PROBE"
          codesign --verify --strict --verbose=2 "$SIGNING_PROBE"
          echo "✅ Certificate imported"

      - name: Build Tauri
        working-directory: desktop
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Notarize .dmg
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          DMG=$(find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" | head -1)
          if [ -f "$DMG" ]; then
            echo "Notarizing: $DMG"
            xcrun notarytool submit "$DMG" \
              --key <(echo "$APPLE_NOTARY_KEY") \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --wait
            xcrun stapler staple "$DMG"
            echo "✅ Notarized and stapled: $DMG"
          else
            echo "::error:: No DMG found for ${{ matrix.target }}"
            exit 1
          fi

      - name: Verify signed and notarized package
        run: |
          DMG=$(find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" | head -1)
          test -n "$DMG"
          xcrun stapler validate "$DMG"
          MOUNT=$(mktemp -d)
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT"
          APP=$(find "$MOUNT" -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          AGENT="$APP/Contents/Resources/resources/kn-agent"
          test -x "$AGENT"
          codesign --verify --strict --verbose=2 "$AGENT"
          AGENT_VERSION=$("$AGENT" --version | sed -n 's/.* \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -1)
          if [ "$AGENT_VERSION" != "${{ needs.validate.outputs.app_version }}" ]; then
            echo "::error::Embedded Agent version ($AGENT_VERSION) does not match App version (${{ needs.validate.outputs.app_version }})"
            exit 1
          fi
          echo "Embedded Agent version: $AGENT_VERSION"
          file "$AGENT"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) file "$AGENT" | grep -q "arm64" ;;
            x86_64-apple-darwin) file "$AGENT" | grep -q "x86_64" ;;
          esac
          hdiutil detach "$MOUNT"
          trap - EXIT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/

  # ── Assemble a manually uploadable release candidate ──
  release-candidate:
    needs: [validate, build]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for git-cliff

      - name: Download macOS Apple Silicon
        uses: actions/download-artifact@v4
        with:
          name: macos-apple-silicon
          path: assets/darwin-aarch64

      - name: Download macOS Intel
        uses: actions/download-artifact@v4
        with:
          name: macos-intel
          path: assets/darwin-x86_64

      - name: Install git-cliff
        run: |
          CLIFF_VERSION="2.8.0"
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          mv git-cliff-*/git-cliff /usr/local/bin/
          chmod +x /usr/local/bin/git-cliff
          git cliff --version

      - name: Generate release notes
        run: |
          if [ -n "${{ inputs.release_notes_override }}" ]; then
            echo "${{ inputs.release_notes_override }}" > release-notes.md
          else
            # Generate notes for the latest tag
            git cliff --latest -o release-notes.md

            # If empty (no previous tag), try unreleased changes
            if [ ! -s release-notes.md ]; then
              git cliff --unreleased -o release-notes.md
            fi

            # Ultimate fallback
            if [ ! -s release-notes.md ]; then
              echo "## v$APP_VERSION" > release-notes.md
              echo "" >> release-notes.md
              echo "Release v$APP_VERSION" >> release-notes.md
            fi
          fi
          echo "=== Generated Release Notes ==="
          cat release-notes.md

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-v${{ env.APP_VERSION }}
          path: |
            assets/**/*.dmg
            release-notes.md
